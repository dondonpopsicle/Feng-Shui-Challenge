<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>揪出風水障礙大挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #app {
            width: 100vw;
            height: 100dvh;
            max-width: calc(100dvh * 750 / 1344);
            max-height: 100dvh;
            background: #fdfbf7;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background: #fdfbf7;
            overflow: hidden;
        }
        .screen.active {
            display: flex;
        }
        
        /* 封面畫面 */
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
        
        /* 封面開始遊戲按鈕 (左上 95,1073 / 右下 655,1192) */
        .start-btn-area {
            position: absolute;
            top: 79.84%;
            left: 12.67%;
            width: 74.67%;
            height: 8.85%;
            cursor: pointer;
            background: transparent;
            z-index: 10;
        }

        /* 遊戲主畫面 */
        .game-view {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        
        /* 隱形點擊熱區 */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: transparent;
        }

        /* 結算畫面：滿版背景模式 */
        .result-screen {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* 1、紅色長方形熱區 (左上 92,943 / 右下 650,1174) */
        .btn-line-link {
            position: absolute;
            top: 70.16%;
            left: 12.27%;
            width: 74.4%;
            height: 17.18%;
            cursor: pointer;
            background: transparent;
            z-index: 10;
        }
        
        /* 2、藍色長方形熱區 (左上 172,1204 / 右下 348,1276) */
        .btn-restart {
            position: absolute;
            top: 89.58%;
            left: 22.93%;
            width: 23.47%;
            height: 5.36%;
            cursor: pointer;
            background: transparent;
            z-index: 10;
            border: none;
        }

        /* 3、綠色長方形熱區 (左上 382,1206 / 右下 565,1277) */
        .btn-share {
            position: absolute;
            top: 89.73%;
            left: 50.93%;
            width: 24.4%;
            height: 5.28%;
            cursor: pointer;
            background: transparent;
            z-index: 10;
            border: none;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. 封面畫面 -->
    <div id="screen-cover" class="screen active">
        <img src="封面.png" class="cover-img" alt="封面">
        <div class="start-btn-area" onclick="startGame()"></div>
    </div>

    <!-- 2. 遊戲房間畫面 -->
    <div id="screen-game" class="screen">
        <div id="game-room" class="game-view" style="background-image: url('進入遊戲的待機畫面.png');">
            <!-- 三個正確的風水盲點熱區 -->
            <div class="hotspot" style="top: 17%; left: 9%; width: 44%; height: 13%; transform: rotate(-26deg); transform-origin: top left;" onclick="clickCorrect(1)"></div>
            <div class="hotspot" style="top: 21%; left: 59%; width: 15%; height: 24%;" onclick="clickCorrect(2)"></div>
            <div class="hotspot" style="top: 39%; left: 59%; width: 24%; height: 21%;" onclick="clickCorrect(3)"></div>
        </div>
    </div>

    <!-- 3. 結算畫面 -->
    <div id="screen-result" class="screen">
        <div id="result-screen" class="result-screen">
            <!-- 紅色長方形：開啟 LINE 連結 -->
            <div class="btn-line-link" onclick="openLine()"></div>
            <!-- 藍色長方形：重新開始遊戲 -->
            <div class="btn-restart" onclick="restartGame()"></div>
            <!-- 綠色長方形：分享結果 -->
            <div class="btn-share" onclick="shareResult()"></div>
        </div>
    </div>
</div>

<script>
    let foundItems = [];
    let errorCount = 0;
    const imageCacheStatus = {};
    const preloadedImages = [];
    let preloadReady = false;

    const PRELOAD_URLS = [
        '進入遊戲的待機畫面.png',
        '找錯了.png',
        '第一個點.png',
        '第二個點.png',
        '第三個點.png',
        'A等級.png',
        'B等級.png',
        'C等級.png'
    ];

    // #region agent log
    function dbg(hypothesisId, location, message, data) {
        fetch('http://127.0.0.1:7390/ingest/6486fe29-9013-4b0d-851a-11ad3a6d39e8',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'a14e1b'},body:JSON.stringify({sessionId:'a14e1b',runId:'post-fix',hypothesisId:hypothesisId,location:location,message:message,data:data||{},timestamp:Date.now()})}).catch(()=>{});
    }
    function measureBgSwap(hypothesisId, location, el, url, extra) {
        const t0 = performance.now();
        const prev = el.style.backgroundImage;
        const alreadyComplete = !!(imageCacheStatus[url] && imageCacheStatus[url].complete);
        el.style.backgroundImage = "url('" + url + "')";
        const img = new Image();
        img.onload = function() {
            const ms = Math.round(performance.now() - t0);
            imageCacheStatus[url] = { complete: true, lastMs: ms };
            dbg(hypothesisId, location, 'bg_swap_complete', Object.assign({url:url,ms:ms,alreadyComplete:alreadyComplete,preloadReady:preloadReady,prev:prev,errorCount:errorCount,foundItems:foundItems.slice()}, extra||{}));
        };
        img.onerror = function() {
            dbg(hypothesisId, location, 'bg_swap_error', Object.assign({url:url,ms:Math.round(performance.now()-t0),alreadyComplete:alreadyComplete,preloadReady:preloadReady}, extra||{}));
        };
        img.src = url;
        dbg(hypothesisId, location, 'bg_swap_start', Object.assign({url:url,alreadyComplete:alreadyComplete,preloadReady:preloadReady,prev:prev,errorCount:errorCount,foundItems:foundItems.slice()}, extra||{}));
    }
    // #endregion

    function preloadGameImages() {
        const t0 = performance.now();
        let loaded = 0;
        const total = PRELOAD_URLS.length;
        // #region agent log
        dbg('A', 'preloadGameImages', 'preload_start', {total:total});
        // #endregion
        PRELOAD_URLS.forEach(function(url) {
            const img = new Image();
            img.onload = function() {
                loaded++;
                imageCacheStatus[url] = { complete: true, lastMs: 0 };
                if (loaded === total) {
                    preloadReady = true;
                    // #region agent log
                    dbg('A', 'preloadGameImages', 'preload_done', {total:total,ms:Math.round(performance.now()-t0)});
                    // #endregion
                }
            };
            img.onerror = function() {
                loaded++;
                // #region agent log
                dbg('A', 'preloadGameImages', 'preload_error', {url:url,loaded:loaded,total:total});
                // #endregion
                if (loaded === total) {
                    preloadReady = true;
                }
            };
            img.src = url;
            preloadedImages.push(img);
        });
    }

    preloadGameImages();
    // #region agent log
    dbg('F', 'script', 'script_loaded', {hasStartGame:typeof startGame === 'function'});
    // #endregion

    function startGame() {
        // #region agent log
        dbg('F', 'startGame', 'start_clicked', {preloadReady:preloadReady});
        // #endregion
        document.getElementById('screen-cover').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        resetGameData();
    }

    function resetGameData() {
        foundItems = [];
        errorCount = 0;
        measureBgSwap('C', 'resetGameData', document.getElementById('game-room'), '進入遊戲的待機畫面.png', {action:'reset'});
    }

    document.getElementById('game-room').addEventListener('click', function(e) {
        if (e.target === this) {
            errorCount++;
            // #region agent log
            dbg('B', 'wrongClick', 'wrong_click', {errorCount:errorCount});
            // #endregion
            measureBgSwap('B', 'wrongClick', document.getElementById('game-room'), '找錯了.png', {action:'wrong'});
        }
    });

    function clickCorrect(id) {
        event.stopPropagation();
        
        if (!foundItems.includes(id)) {
            foundItems.push(id);
            
            var url = id === 1 ? '第一個點.png' : (id === 2 ? '第二個點.png' : '第三個點.png');
            // #region agent log
            dbg('A', 'clickCorrect', 'correct_click', {id:id,url:url,errorCount:errorCount,foundCount:foundItems.length});
            // #endregion
            measureBgSwap('A', 'clickCorrect', document.getElementById('game-room'), url, {action:'correct',id:id});
        }

        if (foundItems.length === 3) {
            setTimeout(showResult, 1500);
        }
    }

    function showResult() {
        document.getElementById('screen-game').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');

        const resultScreen = document.getElementById('result-screen');
        var resultUrl = errorCount === 0 ? 'A等級.png' : (errorCount <= 3 ? 'B等級.png' : 'C等級.png');
        // #region agent log
        dbg('E', 'showResult', 'show_result', {errorCount:errorCount,resultUrl:resultUrl});
        // #endregion
        measureBgSwap('E', 'showResult', resultScreen, resultUrl, {action:'result'});
    }

    function openLine() {
        window.location.href = "https://actshop.io/r/71118e";
    }

    function restartGame() {
        document.getElementById('screen-result').classList.remove('active');
        document.getElementById('screen-cover').classList.add('active');
        resetGameData();
    }

    function shareResult() {
        if (navigator.share) {
            navigator.share({
                title: '揪出風水障礙大挑戰',
                text: '快來看看你風水功力到哪個等級！',
                url: window.location.href
            }).catch(() => {
                alert("已複製分享連結！");
            });
        } else {
            alert("已複製連結，歡迎分享給好友挑戰！");
        }
    }
</script>

</body>
</html>
